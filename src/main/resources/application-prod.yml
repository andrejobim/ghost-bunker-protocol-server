# Staging / production-oriented profile (single-node, in-memory, Privacy-Max).
# Activate with: SPRING_PROFILES_ACTIVE=prod
#
# TLS termination and access-log policy belong at the reverse proxy — see
# docs/reverse-proxy-deployment.md.

server:
  # Bind all interfaces inside the container; restrict reachability with network policy.
  address: 0.0.0.0
  port: 8080
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 10s

ghostbunker:
  websocket:
    # REQUIRED for staging: set trusted browser origins (HTTPS only), e.g.
    # GHOSTBUNKER_WEBSOCKET_ALLOWED_ORIGINS=https://staging.example.com
    allowed-origins: []
    required-subprotocol: ghost-bunker.v0.1
  shutdown:
    grace-period-ms: 2000

management:
  server:
    # Metrics/health on a separate port so the public proxy only exposes WebSocket traffic.
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    enable:
      http: false
      tomcat: false
